schema_version = 1

[permissions]
# 默认 YOLO；需要工具审批时改为 ASK_PERMISSIONS。
mode = "YOLO"

[server]
listen = "127.0.0.1:4500"
# data_dir defaults to <AREAL_HARNESS_HOME>/state.

[model]
# 仅 Responses 且服务支持 WebSocket 时显式开启；默认 false。
# responses_websocket = true
# reasoning_effort = "xhigh"
# 仅选择 responses 且模型支持摘要时启用。
# reasoning_summary = "auto"
# max_output_tokens = 8192
max_retries = 2
provider = "company"
name = "your-model-id"

[model.providers.company]
protocol = "chat-completions"
endpoint = "https://gateway.example.com/v1/chat/completions"
api_key_env = "COMPANY_MODEL_API_KEY"

[limits]
watchdog_disable = false
stream_idle_timeout_seconds = 30
max_history_bytes = 2097152
max_output_bytes = 262144
max_tool_calls = 128
max_tool_buffer_bytes = 4194304
context_window_bytes = 524288
# 关闭时达到上下文阈值直接失败，手动压缩也不可用。
# context_compaction_enabled = false
context_recent_bytes = 131072
context_window_tokens = 65536
context_output_reserve_tokens = 8192
model_concurrency = 32
max_threads = 20000

[logging]
filter = "info"

# 可选：工具等待策略、自定义命令工具与 hooks；详见 docs/guides/tools.md。
# [tools]
# extensions_file = "tools.json"

# Goal 执行限制；客户端用 /goal 创建目标，无需功能开关。
[goals]
max_turns = 100
max_active_seconds = 3600
max_unreported_turns = 3
turn_model_rounds = 32
