name: iOS development checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/gui/**'
      - 'clients/mobile/**'
      - 'services/remote-relay/**'
      - '.github/workflows/ios-development.yml'
  push:
    branches: [main]
    paths:
      - 'clients/gui/**'
      - 'clients/mobile/**'
      - 'services/remote-relay/**'
      - '.github/workflows/ios-development.yml'

permissions:
  contents: read

concurrency:
  group: ios-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.2.0'
      - name: Retain Relay runtime
        run: echo "AREAL_RELAY_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Install locked dependencies and browsers
        run: |
          npm install --global pnpm@11.7.0
          pnpm --dir clients/gui install --frozen-lockfile
          npm --prefix services/remote-relay ci --ignore-scripts
          pnpm --dir clients/gui/app exec playwright-core install --with-deps chromium webkit
      - name: Check mobile types
        run: pnpm --dir clients/gui mobile:typecheck
      - name: Verify browser development loop and bundled assets
        run: pnpm --dir clients/gui test:mobile-browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mobile-browser-evidence
          path: .scratch/ios-development/browser/
          include-hidden-files: true
          if-no-files-found: warn
